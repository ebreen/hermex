# Contributor CI: run the Improvements contract validator on cheap Ubuntu for
# every pull request, then build and run the full XCTest suite when app code is
# touched. Docs-only PRs skip only the macOS runner.
#
# The required branch-protection check is "CI Gate", not "Build and Test":
# a skipped required check would block merges forever, so the gate always
# runs and passes when the suite either succeeded or was legitimately skipped.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Code signing is disabled (CODE_SIGNING_ALLOWED=NO) — fine for compile/test
# runs per DEVELOPMENT.md; the "simulator installs must be signed" rule applies
# to manual simulator testing, not CI.

name: PR CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.filter.outputs.run_ios }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata_file=$(mktemp)
          files_file=$(mktemp)
          trap 'rm -f "${metadata_file}" "${files_file}"' EXIT
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" > "${metadata_file}"
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --slurp > "${files_file}"
          run_ios=$(
            python3 - "${metadata_file}" "${files_file}" <<'PY'
          import json
          import re
          import sys

          def fail(message: str) -> None:
              raise SystemExit(f"Changed-file classification failed: {message}")

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              pages = json.load(handle)

          expected = metadata.get("changed_files") if isinstance(metadata, dict) else None
          if type(expected) is not int or expected <= 0:
              fail(f"invalid changed_files count: {expected!r}")
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              fail("files response is not a paginated list")
          records = [record for page in pages for record in page]
          if len(records) != expected:
              fail(f"expected {expected} file records, received {len(records)}")

          allowed_statuses = {"added", "removed", "modified", "renamed", "copied", "changed", "unchanged"}
          paths = []
          for index, record in enumerate(records):
              if not isinstance(record, dict):
                  fail(f"record {index} is not an object")
              filename = record.get("filename")
              status = record.get("status")
              if not isinstance(filename, str) or not filename or "\x00" in filename:
                  fail(f"record {index} has an invalid filename")
              if status not in allowed_statuses:
                  fail(f"record {index} has an invalid status: {status!r}")
              paths.append(filename)
              previous = record.get("previous_filename")
              if status in ("renamed", "copied"):
                  if not isinstance(previous, str) or not previous or "\x00" in previous:
                      fail(f"{status} record {index} has no valid previous_filename")
                  paths.append(previous)
              elif previous is not None:
                  fail(f"non-renamed record {index} unexpectedly has previous_filename")

          docs_only = re.compile(
              r"(?:docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*|"
              r"\.github/CODEOWNERS|\.github/dependabot\.yml|\.github/FUNDING\.yml|.*\.md)"
          )
          for path in paths:
              print(f"Changed path: {path!r}", file=sys.stderr)
          print("true" if any(docs_only.fullmatch(path) is None for path in paths) else "false")
          PY
          )
          printf 'run_ios=%s\n' "${run_ios}" >> "$GITHUB_OUTPUT"
          if [[ "${run_ios}" == "true" ]]; then
            printf '%s\n' "Non-docs changes detected — running the full suite."
          elif [[ "${run_ios}" == "false" ]]; then
            printf '%s\n' "Docs-only change — skipping the macOS runner."
          else
            printf '%s\n' "Classifier returned an invalid result: ${run_ios}" >&2
            exit 1
          fi

  contract:
    name: Improvements contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate canonical contract
        id: validate
        run: |
          set -euo pipefail
          expected_count=25
          log_file=$(mktemp)
          trap 'rm -f "${log_file}"' EXIT
          python3 -m unittest tests/test_fork_contract.py -v 2>&1 | tee "${log_file}"
          actual_count=$(
            python3 - "${log_file}" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          counts = re.findall(r"(?m)^Ran (\d+) tests in ", text)
          if len(counts) != 1:
              raise SystemExit(f"expected one unittest count, found {counts}")
          print(counts[0])
          PY
          )
          if [[ "${actual_count}" != "${expected_count}" ]]; then
            echo "Contract test manifest mismatch: expected ${expected_count}, found ${actual_count}." >&2
            exit 1
          fi
          printf 'validated=true\n' >> "$GITHUB_OUTPUT"

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult
      TEST_WORKER_COUNT: 1

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              device["name"]
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          print(preferred if preferred in phones else phones[0] if phones else "")
          ')
          if [[ -z "${name}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test without building
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (${TEST_WORKER_COUNT} workers): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: CI Gate
    needs: [changes, contract, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "contract: ${{ needs.contract.result }}"
          echo "contract validated: ${{ needs.contract.outputs.validated }}"
          echo "run_ios: ${{ needs.changes.outputs.run_ios }}"
          echo "test: ${{ needs.test.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          if [[ "${{ needs.contract.result }}" != "success" ]]; then
            echo "Improvements contract validation failed — failing the gate." >&2
            exit 1
          fi
          if [[ "${{ needs.contract.outputs.validated }}" != "true" ]]; then
            echo "Improvements contract validator did not prove execution — failing the gate." >&2
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run_ios }}" == "true" ]]; then
            if [[ "${{ needs.test.result }}" != "success" ]]; then
              echo "Build and Test was required but did not pass — failing the gate." >&2
              exit 1
            fi
          elif [[ "${{ needs.changes.outputs.run_ios }}" == "false" ]]; then
            if [[ "${{ needs.test.result }}" != "skipped" ]]; then
              echo "Build and Test ran unexpectedly for a docs-only change — failing the gate." >&2
              exit 1
            fi
          else
            echo "Path detection returned an invalid run_ios value — failing the gate." >&2
            exit 1
          fi
          echo "Gate passed."
