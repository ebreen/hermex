name: Bug report
description: Something in the app is broken or behaving unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    id: public-privacy
    attributes:
      label: Public issue privacy
      description: GitHub issues and attachments are public. Remove private or identifying data before submitting. Security vulnerabilities must use the private process in SECURITY.md.
      options:
        - label: I removed credentials, authorization headers, private server URLs, prompts, transcripts, Memory excerpts, and other personal data.
          required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that take a fresh install (or a known state) to the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / commit
      description: SideStore artifact version/build plus source commit, or the commit you built locally.
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version and device
      placeholder: e.g. iOS 18.5 on iPhone 15 Pro, or iOS 18 simulator
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Hermex WebUI fork commit
      description: The full commit from `WEBUI_FORK_TESTED_SHA` and, when relevant, the paired Hermes Agent commit.
    validations:
      required: true
  - type: dropdown
    id: connection-path
    attributes:
      label: How the phone reaches the server
      options:
        - HTTPS tunnel (e.g. Cloudflare Tunnel)
        - Reverse proxy
        - Tailscale
        - localhost (simulator only)
        - Other
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Attachments are public. Redact private URLs, account details, prompts, transcripts, Memory, notifications, and other identifying data before uploading.
    validations:
      required: false
